<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a6d36a"><title>شدوینگ</title>
<style>
:root{--bg:#f4f8e8;--card:#fff;--ink:#27321a;--mut:#69764f;--pis:#a6d36a;--pd:#1f2c0f;--can:#ffe55c;--canl:#fff6b8;--org:#f58a1f;--od:#2b1800;--line:#dce8c4;--bad:#b3261e}
:root[data-theme=dark]{--bg:#141a0e;--card:#1e2715;--ink:#eef5df;--mut:#a9b78d;--pis:#b9e07f;--pd:#17210a;--can:#ffe55c;--canl:#3a3612;--org:#ff9b3d;--od:#2b1800;--line:#2c3a1f;--bad:#ff8a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 Vazirmatn,Tahoma,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 86px}
main,#ses>div{max-width:560px;margin:auto;padding:14px 16px}h1{font-size:24px;margin:10px 0 14px}h2{font-size:18px;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0}
.hero{background:var(--pis);color:var(--pd);border:0}.hero small{color:inherit;opacity:.8}.hero b{font-size:34px}.plan{background:var(--canl);border-color:var(--can)}
button,select,input{font:inherit;color:inherit}button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 15px;margin:3px;cursor:pointer}
button.pri{background:var(--org);color:var(--od);border-color:var(--org);font-weight:700}button.big{width:100%;padding:15px;font-size:18px;margin:10px 0;border-radius:16px}
select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
input[type=text],input:not([type]){width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:6px 0}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:4}
nav button{flex:1;border:0;margin:0;background:none;color:var(--mut);padding:9px 2px;border-radius:14px}nav button.on{background:var(--pis);color:var(--pd);font-weight:700}
.note{background:var(--canl);border:1px solid var(--can);padding:10px 14px;border-radius:14px}small,.mut{color:var(--mut)}.err{color:var(--bad)}
.ln{direction:ltr;text-align:left;margin:6px 0 0;padding:8px 12px;border-radius:14px;font-size:19px;cursor:pointer}.ln.cur{background:var(--can);color:#2b2600}
.tr{margin:2px 0 8px;padding:6px 12px;border-radius:12px;background:var(--canl);font-size:16px}.en{direction:ltr;text-align:left;font-size:21px;margin:8px 0}
.chips{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding-bottom:4px}.chips button{flex:none}.chips button.on{background:var(--pis);color:var(--pd);border-color:var(--pis)}
#ses{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:6}.dots span{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--line);margin:2px}.dots .y{background:var(--org)}
.mic{width:88px;height:88px;border-radius:50%;font-size:15px;display:block;margin:14px auto}.mic.on{animation:p 1s infinite;background:var(--can);border-color:var(--can);color:#2b2600}@keyframes p{50%{transform:scale(1.08)}}
.fb{border-inline-start:4px solid var(--org);padding-inline-start:12px;margin:12px 0}.fb .bad{text-decoration:line-through;color:var(--bad)}
</style></head><body>
<main id="m"></main><nav id="n"></nav><div id="ses" hidden></div><audio id="sil"></audio>
<script>
const $=s=>document.querySelector(s),fa=n=>Number(n).toLocaleString('fa-IR'),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const K='shadowing_v1',D={days:[],lines:0,mins:0,vocab:{},done:{},theme:'auto',rate:1,voice:'',url:'',g:true,gen:[],lv:'B1',td:{d:'',sh:0,ans:0,rv:0},mist:[],pw:[],rec:[],pin:'',coach:null,cd:'',track:'ielts'};
let S;try{S={...D,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){S={...D}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const day=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const td=()=>{if(S.td.d!=day())S.td={d:day(),sh:0,ans:0,rv:0};return S.td},chk=b=>b?'✅':'⬜';
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return day(d)};
function streak(){let c=0,d=new Date();if(!S.days.includes(day(d)))d.setDate(d.getDate()-1);while(S.days.includes(day(d))){c++;d.setDate(d.getDate()-1)}return c}
const gap=()=>S.days.length?Math.round((new Date(day())-new Date([...S.days].sort().pop()))/864e5):0;
function markDay(m){S.mins+=m;if(!S.days.includes(day()))S.days.push(day());save()}
function theme(){const dk=S.theme=='dark'||(S.theme=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dk?'dark':'light'}
// ---- Gemini via Apps Script ----
async function api(b){if(!S.url)throw new Error('آدرس Apps Script را در بخش «بیشتر» وارد کن.');const c=new AbortController(),t=setTimeout(()=>c.abort(),50000);let r,j;try{r=await fetch(S.url,{method:'POST',body:JSON.stringify({...b,pin:S.pin}),signal:c.signal})}catch(e){throw new Error(e.name=='AbortError'?'بک‌اند دیر جواب داد (بیش از ۵۰ ثانیه). دوباره امتحان کن.':'اتصال به بک‌اند برقرار نشد. بررسی کن: ۱) آدرس با /exec تمام شود. ۲) در Deploy گزینهٔ Who has access روی Anyone باشد. ۳) اینترنت یا VPN قطع نباشد.')}finally{clearTimeout(t)}try{j=await r.json()}catch(e){throw new Error('جواب بک‌اند درست نبود. معمولاً یعنی دسترسی Deploy روی Anyone نیست یا آدرس اشتباه است.')}if(!j.ok)throw new Error(j.err||'خطا');return j}
const idb=new Promise(r=>{try{const q=indexedDB.open('sh',1);q.onupgradeneeded=()=>q.result.createObjectStore('a');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbG=async k=>{const d=await idb;return d?new Promise(r=>{const q=d.transaction('a').objectStore('a').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}):null};
const idbS=async(k,v)=>{const d=await idb;if(d)try{d.transaction('a','readwrite').objectStore('a').put(v,k)}catch(e){}};
const pm=new Map();
function gAud(tx,vo){const k=vo+'|'+tx;if(!pm.has(k))pm.set(k,(async()=>{let b=await idbG(k);if(!b){b=(await api({a:'tts',text:tx,voice:vo})).audio;idbS(k,b)}const u=atob(b),a=new Uint8Array(u.length);for(let i=0;i<u.length;i++)a[i]=u.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:'audio/wav'}))})().catch(e=>{pm.delete(k);throw e}));return pm.get(k)}
let cur=null,gBad=false;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function playA(u,rate){return new Promise(res=>{const a=new Audio(u);cur=a;a.playbackRate=rate;a.onended=a.onerror=a.onpause=()=>res();a.play().catch(res)})}
function bspk(tx,rate){return new Promise(res=>{const t0=Date.now(),u=new SpeechSynthesisUtterance(tx);u.lang='en-US';u.rate=rate;const v=speechSynthesis.getVoices().find(v=>v.name==S.voice);if(v)u.voice=v;const f=setTimeout(res,tx.length*130/rate+4000);u.onend=u.onerror=()=>{clearTimeout(f);if(tx.length>15&&Date.now()-t0<400&&!stm.includes('⚠'))setSt((stm?stm+' ':'')+'⚠ صدای مرورگر خروجی نداد. حجم رسانهٔ گوشی را چک کن. اگر درست بود، موتور TTS گوشی انگلیسی ندارد؛ پس باید اتصال Gemini درست شود (بیشتر ← تست صدا).');res()};speechSynthesis.speak(u)})}
async function spk(tx,rate,sp){if(S.url&&S.g&&!gBad){try{return await playA(await gAud(tx,sp=='B'?'Puck':'Kore'),rate)}catch(e){gBad=true;setSt('صدای Gemini کار نکرد: '+e.message+' — فعلاً با صدای مرورگر ادامه می‌دهم.')}}return bspk(tx,rate)}
// ---- coach + sync ----
const snap=()=>({ts:Date.now(),days:S.days,lines:S.lines,mins:S.mins,vocab:S.vocab,done:S.done,mist:S.mist,pw:S.pw,rec:S.rec,track:S.track,lv:S.lv,due:Object.values(S.vocab).filter(v=>v.due<=day()).length});
async function push(){if(!S.url)return;try{await api({a:'save',data:snap()})}catch(e){}}
async function pull(){if(!S.url)return;try{const d=(await api({a:'load'})).data;if(d&&!S.days.length&&!Object.keys(S.vocab).length){Object.assign(S,{days:d.days||[],lines:d.lines||0,mins:d.mins||0,vocab:d.vocab||{},done:d.done||{},mist:d.mist||[],pw:d.pw||[],rec:d.rec||[],track:d.track||S.track,lv:d.lv||S.lv});save()}else push()}catch(e){}}
async function coachGet(){const e=$('#ce');if(e)e.textContent='مربی دارد برنامه می‌چیند…';try{const r=await api({a:'coach',data:snap()});S.coach=r.plan;S.cd=day();save()}catch(x){if(e)e.textContent=x.message;return}render()}
async function coachShadow(){const c=S.coach.shadow,e=$('#ce');e.textContent='در حال ساختن متن…';try{const o=(await api({a:'gen',track:c.track,level:c.level,topic:c.topic})).text;const t={id:'g'+Date.now(),track:c.track,title:o.t,level:c.level,lines:o.lines.map((l,i)=>[o.dlg?(i%2?'B':'A'):0,l]),fa:o.fa||[],vocab:o.vocab.map(v=>[v[0],v[1]])};S.gen.unshift(t);S.gen=S.gen.slice(0,40);S.track=c.track;save();start(t.id)}catch(x){e.textContent=x.message}}
const coachCard=()=>{if(!S.url)return '';const c=S.cd==day()&&S.coach;if(!c)return `<div class=card><b>مربی</b><br><button class=pri onclick="coachGet()">برنامهٔ امروز از مربی</button><p class=mut id=ce></p></div>`;const m=MODES.some(x=>x[0]==c.talk.mode)?c.talk.mode:'sp1';return `<div class="card hero"><b style=font-size:18px>مربی</b><br>${esc(c.msg)}</div><div class=card>${c.focus&&c.focus.length?'<b>تمرکز امروز:</b> '+c.focus.map(esc).join('، ')+'<br>':''}<button class=big onclick="coachShadow()">شدوینگ: ${esc(c.shadow.topic)} (${esc(c.shadow.level)})</button><button class=big onclick="tab='talk';tStart('${m}')">گفتگو: ${MODES.find(x=>x[0]==m)[1]}</button><p class=mut id=ce></p>${(c.grammar||[]).map(g=>`<div class=fb>${esc(g.rule)}<div class=en>${esc(g.example)}</div></div>`).join('')}</div>`};
// ---- texts ----
const T=[
{id:'i1',track:'ielts',title:'Speaking Part 1: شهر من',level:'B2',lines:[[0,"I'm from a medium-sized city in the north of Iran."],[0,"It's a lively place, and the people there are very welcoming."],[0,"What I like most is spring, when everything turns green."],[0,"That said, the traffic can be quite stressful during rush hour."],[0,"If I had the chance, I would move closer to the sea."],[0,"Having said that, I'll always feel attached to my hometown."]],vocab:[["welcoming","مهمان‌نواز"],["rush hour","ساعت شلوغی"],["attached to","وابسته به"],["That said","با این حال"]]},
{id:'i2',track:'ielts',title:'Listening بخش ۱: ثبت‌نام باشگاه',level:'B1',lines:[['A',"Good morning, how can I help you?"],['B',"Hi, I'd like to join the gym. What membership options do you have?"],['A',"We have a monthly plan and an annual plan."],['B',"What's the difference in price?"],['A',"The annual plan saves you about twenty percent."],['B',"Does it include the swimming pool?"],['A',"Yes, and you can use it any day until ten at night."],['B',"Great, I'll take the annual plan."]],vocab:[["membership","عضویت"],["annual","سالانه"],["include","شامل شدن"],["option","گزینه"]]},
{id:'t1',track:'tech',title:'تحویل شیفت: چیلر',level:'B1',lines:[['A',"Good morning. Here is the handover for chiller number two."],['B',"Go ahead. How is it running?"],['A',"It tripped twice last night on low water flow."],['B',"Did you check the strainer?"],['A',"Yes, I cleaned it, and the flow is normal now."],['B',"What about the chilled water temperature?"],['A',"It's stable at seven degrees, but please keep an eye on it."],['B',"Understood. I'll log it and report any changes."]],vocab:[["handover","تحویل شیفت"],["trip","قطع شدن (تریپ)"],["strainer","صافی"],["chilled water","آب سرد"],["flow","دبی / جریان"]]},
{id:'t2',track:'tech',title:'عیب‌یابی پمپ و ایمنی',level:'B1',lines:[['A',"The booster pump is making a loud noise."],['B',"Is the discharge pressure normal?"],['A',"No, it dropped from five bar to three bar."],['B',"It could be cavitation. Check the suction valve first."],['A',"The suction valve is fully open."],['B',"Then inspect the strainer and the bearings."],['A',"I will isolate the pump and apply lockout before opening it."],['B',"Good. Safety first."]],vocab:[["discharge pressure","فشار خروجی"],["cavitation","کاویتاسیون"],["suction","مکش"],["lockout","قفل‌گذاری ایمنی (LOTO)"],["bearing","بلبرینگ"]]}];
const FA={
i1:["من اهل یک شهر متوسط در شمال ایران هستم.","شهر پرجنب‌وجوشی است و مردمش خیلی مهمان‌نوازند.","بیشتر از همه بهار را دوست دارم، وقتی همه‌چیز سبز می‌شود.","با این حال، ترافیک در ساعت شلوغی می‌تواند خیلی استرس‌زا باشد.","اگر فرصتش را داشتم، به جایی نزدیک‌تر به دریا نقل‌مکان می‌کردم.","با این همه، همیشه به زادگاهم وابسته خواهم ماند."],
i2:["صبح بخیر، چطور می‌توانم کمکتان کنم؟","سلام، می‌خواهم عضو باشگاه شوم. چه گزینه‌های عضویتی دارید؟","طرح ماهانه و طرح سالانه داریم.","تفاوت قیمتشان چقدر است؟","طرح سالانه حدود بیست درصد صرفه‌جویی دارد.","استخر هم شامل می‌شود؟","بله، و هر روز تا ساعت ده شب می‌توانید از آن استفاده کنید.","عالی، طرح سالانه را می‌گیرم."],
t1:["صبح بخیر. این گزارش تحویل شیفت چیلر شمارهٔ دو است.","بفرمایید. وضعیت کارش چطور است؟","دیشب دو بار به‌خاطر کمبود جریان آب تریپ کرد.","صافی را بررسی کردی؟","بله، تمیزش کردم و الان جریان آب عادی است.","دمای آب سرد چطور؟","روی هفت درجه ثابت است، ولی لطفاً حواست بهش باشد.","متوجه شدم. ثبتش می‌کنم و هر تغییری را گزارش می‌دهم."],
t2:["پمپ بوستر صدای بلندی می‌دهد.","فشار خروجی عادی است؟","نه، از پنج بار به سه بار افت کرده.","ممکن است کاویتاسیون باشد. اول شیر مکش را چک کن.","شیر مکش کاملاً باز است.","پس صافی و بلبرینگ‌ها را بازرسی کن.","پمپ را ایزوله می‌کنم و قبل از بازکردنش قفل‌گذاری ایمنی (لاک‌اوت) انجام می‌دهم.","خوب. ایمنی اول."]};
const allT=()=>[...T,...S.gen],texts=()=>allT().filter(t=>t.track==S.track),next=()=>texts().sort((a,b)=>(S.done[a.id]||0)-(S.done[b.id]||0))[0];
const sw=()=>`<div class=chips><button class="${S.track=='ielts'?'on':''}" onclick="S.track='ielts';save();render()">آیلتس</button><button class="${S.track=='tech'?'on':''}" onclick="S.track='tech';save();render()">انگلیسی تأسیسات</button></div>`;
// ---- conversation ----
const MODES=[['sp1','IELTS Speaking Part 1'],['sp3','IELTS Speaking Part 3'],['job','مصاحبهٔ شغلی مهندسی'],['site','گفتگوی کاری در موتورخانه']];
let tk={mode:'',h:[],q:'',busy:false,fb:null,lis:false,err:''};
async function tSay(){if(!tk.q)return;if(S.url&&S.g){try{return await playA(await gAud(tk.q,'Kore'),1)}catch(e){}}bspk(tk.q,1)}
async function tAsk(){tk.busy=true;tk.err='';render();try{tk.q=(await api({a:'chat',mode:tk.mode,h:tk.h})).q}catch(e){tk.err=e.message}tk.busy=false;render();tSay()}
function tStart(m){tk={mode:m,h:[],q:'',busy:false,fb:null,lis:false,err:'',t0:Date.now()};tAsk()}
function tSend(a){a=(a||'').trim();if(!a||tk.busy)return;tk.h.push({q:tk.q,a});td().ans++;save();tAsk()}
function tMic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){tk.err='این مرورگر تشخیص گفتار ندارد؛ جواب را تایپ کن.';return render()}stopAll();const r=new R();r.lang='en-US';r.onresult=e=>tSend(e.results[0][0].transcript);r.onend=()=>{tk.lis=false;render()};r.onerror=()=>{tk.err='صدایی شنیده نشد. دوباره امتحان کن یا تایپ کن.'};tk.lis=true;tk.err='';r.start();render()}
async function tFb(){if(!tk.h.length)return;tk.busy=true;tk.err='';render();try{tk.fb=(await api({a:'fb',mode:tk.mode,h:tk.h})).fb;tk.fb.items.forEach(i=>S.mist.push({s:i.said,b:i.better,w:i.why,d:day()}));S.mist=S.mist.slice(-40);markDay(Math.max(1,Math.round((Date.now()-tk.t0)/6e4)));push()}catch(e){tk.err=e.message}tk.busy=false;render()}
async function genT(){const b=$('#gb');b.disabled=true;b.textContent='در حال ساخت…';try{const o=(await api({a:'gen',track:S.track,level:S.lv,topic:$('#gt').value})).text;S.gen.unshift({id:'g'+Date.now(),track:S.track,title:o.t,level:S.lv,lines:o.lines.map((l,i)=>[o.dlg?(i%2?'B':'A'):0,l]),fa:o.fa||[],vocab:o.vocab.map(v=>[v[0],v[1]])});S.gen=S.gen.slice(0,40);save();render()}catch(e){b.disabled=false;b.textContent='بساز';$('#ge').textContent=e.message}}
let stm='';const setSt=t=>{stm=t;const e=$('#st');if(e){e.textContent=t;e.hidden=!t}};
const fa_=(t,i)=>(t.fa&&t.fa[i])||(FA[t.id]||[])[i]||'';
function trT(i){const e=$('#f'+i);if(e)e.hidden=!e.hidden}
const URLRE=/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[^\s\/]+\/exec$/;
async function saveUrl(){const o=$('#us');S.url=$('#ui').value.trim();S.pin=$('#pin').value.trim();save();if(!URLRE.test(S.url)){o.innerHTML='<span class=err>این آدرس درست نیست. باید با https://script.google.com/macros/s/ شروع و با /exec تمام شود (همان «Web app URL» بعد از Deploy).</span>';return}o.textContent='در حال تست…';try{await api({a:'ping'});o.textContent='✅ بک‌اند وصل است و کلید Gemini پیدا شد.'}catch(e){o.innerHTML='<span class=err>'+esc(e.message)+'</span>'}}
async function tB(){const o=$('#us2'),t=Date.now();o.textContent='گوش بده…';await bspk('Hello, this is a sound test.',1);o.textContent=Date.now()-t<500?'❌ صدای مرورگر خروجی نداد. حجم رسانهٔ گوشی را چک کن؛ اگر درست بود، موتور TTS گوشی انگلیسی ندارد.':'✅ صدای مرورگر پخش شد (اگر نشنیدی، حجم رسانه را بالا ببر).'}
async function tG(){const o=$('#us2');o.textContent='در حال ساخت صدا (چند ثانیه)…';try{await playA(await gAud('Hello, this is a sound test.','Kore'),1);o.textContent='✅ صدای Gemini ساخته و پخش شد (اگر نشنیدی، حجم رسانه را بالا ببر).'}catch(e){o.innerHTML='<span class=err>'+esc(e.message)+'</span>'}}
// ---- views ----
let tab='home';const tabs=[['home','خانه'],['lib','کتابخانه'],['talk','گفتگو'],['rev','مرور'],['more','بیشتر']];
const due=()=>Object.entries(S.vocab).filter(([k,v])=>v.due<=day());
const V={

if(tk.fb)return `<h1>بازخورد</h1><div class=card>${esc(tk.fb.summary)}</div>${tk.fb.items.map(i=>`<div class=fb><div class="en bad">${esc(i.said)}</div><div class=en><b>${esc(i.better)}</b></div><div>${esc(i.why)}</div></div>`).join('')}<button class=big onclick="tk.mode='';tk.fb=null;render()">گفتگوی تازه</button>`;

more:()=>{let h='';for(let i=13;i>=0;i--)h+=`<span class="${S.days.includes(addDays(-i))?'y':''}"></span>`;return `<h1>پیشرفت</h1><div class=card>روزهای تمرین: <b>${fa(S.days.length)}</b><br>زنجیرهٔ فعلی: <b>${fa(streak())}</b> روز<br>خط‌های تکرارشده: <b>${fa(S.lines)}</b><br>دقیقه‌های تمرین: <b>${fa(S.mins)}</b><div class=dots>${h}</div></div><h2>تنظیمات</h2>
<div class=card>حالت نمایش: <select onchange="S.theme=this.value;save();theme()">${[['auto','خودکار'],['light','روشن'],['dark','تاریک']].map(o=>`<option value=${o[0]} ${S.theme==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
<div class=card>سرعت پیش‌فرض: <input type=range min=.6 max=1.2 step=.1 value=${S.rate} onchange="S.rate=+this.value;save()"></div>
<div class=card><b>اتصال به بک‌اند</b><br><small>آدرس Web app (باید با /exec تمام شود)</small><input id=ui style=direction:ltr value="${esc(S.url)}"><button class=pri onclick="saveUrl()">ذخیره و تست اتصال</button><p id=us></p><label><input type=checkbox ${S.g?'checked':''} onchange="S.g=this.checked;save()"> صدای Gemini به‌جای صدای مرورگر</label><br><button onclick="tG()">تست صدای Gemini</button><button onclick="tB()">تست صدای مرورگر</button><p id=us2></p></div><div class=card><small>پین (اختیاری؛ فقط اگر APP_PIN گذاشته‌ای)</small><input id=pin style=direction:ltr value="${esc(S.pin)}"></div>

function render(){$('#n').innerHTML=tabs.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');$('#m').innerHTML=V[tab]()}
function grade(k,ok){const v=S.vocab[k],I=[1,1,3,7,16,35];v.box=ok?Math.min(v.box+1,5):0;v.due=addDays(I[v.box]);td().rv++;save();render()}
// ---- shadowing session ----
let ses;const NAMES=['بدون متن','با متن','خط‌به‌خط','هم‌زمان','ضبط'];
function sil(){const a=$('#sil');if(!a.src){const n=8000,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>[...s].forEach((c,i)=>b[o+i]=c.charCodeAt(0));w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);for(let i=44;i<b.length;i+=400)b[i]=129;a.src=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));a.loop=true;a.volume=.05}return a.play().catch(()=>{})}
function ms(){if(!('mediaSession' in navigator))return;try{navigator.mediaSession.metadata=new MediaMetadata({title:ses.t.title,artist:'Shadowing'});['pause','stop'].forEach(a=>navigator.mediaSession.setActionHandler(a,stopAll));navigator.mediaSession.setActionHandler('play',play)}catch(e){}}
function stopAll(){if(ses)ses.tok++;speechSynthesis.cancel();if(cur)cur.pause();$('#sil').pause();if(ses&&ses.nx)ses.nx()}
const mark=i=>{document.querySelectorAll('.ln').forEach((e,j)=>e.classList.toggle('cur',i==j));const e=$('#l'+i);if(e)e.scrollIntoView({block:'center',behavior:'smooth'})};
async function play(){stopAll();const tok=++ses.tok,L=ses.t.lines;await sil();ms();
if(S.url&&S.g&&!gBad)(async()=>{for(const[sp,tx]of L){try{await gAud(tx,sp=='B'?'Puck':'Kore')}catch(e){return}}})();
do{for(let i=0;i<L.length;i++){if(tok!==ses.tok)return;const[sp,tx]=L[i];mark(i);
if(ses.step==4&&ses.role&&sp==ses.role){await wait(Math.max(2500,tx.length*90));continue}
const reps=ses.step==3?ses.rep:1;
for(let r=0;r<reps;r++){if(tok!==ses.tok)return;if(ses.step==3){await spk(tx,ses.rate*.7,sp);if(tok!==ses.tok)return;await wait(500)}
await spk(tx,ses.rate,sp);if(ses.step>=3)S.lines++;await wait(ses.step==4?400:600)}
if(ses.step==3&&!ses.auto&&i<L.length-1){await new Promise(r=>ses.nx=r);ses.nx=null}}
}while(ses.loop&&tok===ses.tok);if(tok===ses.tok){mark(-1);$('#sil').pause()}}
function start(id){gBad=false;stm=S.url?'':'برای صدای طبیعی Gemini، آدرس Apps Script را در بخش «بیشتر» وارد کن؛ فعلاً صدای مرورگر پخش می‌شود.';ses={tr:false,t:allT().find(t=>t.id==id),step:1,role:'',rate:S.rate,rep:1,loop:false,auto:true,tok:0,t0:Date.now()};sesUI()}
function sesUI(){const s=ses,two=typeof s.t.lines[0][0]=='string';$('#ses').hidden=false;$('#ses').innerHTML=`<div><button onclick="closeS()">بستن</button> <b>${s.t.title}</b>
<div class=chips>${NAMES.map((n,i)=>`<button class="${s.step==i+1?'on':''}" onclick="stopAll();ses.step=${i+1};sesUI()">${fa(i+1)}. ${n}</button>`).join('')}</div>
<div class=card><button class=pri onclick="play()">پخش</button><button onclick="stopAll()">توقف</button>${s.step==3&&!s.auto?'<button onclick="ses.nx&&ses.nx()">خط بعدی</button>':''}<br>
سرعت <input type=range min=.6 max=1.2 step=.1 value=${s.rate} onchange="ses.rate=+this.value"><br>
<label>تکرار هر خط <select onchange="ses.rep=+this.value">${[1,2,3].map(n=>`<option ${s.rep==n?'selected':''}>${n}</option>`).join('')}</select></label>
<label><input type=checkbox ${s.tr?'checked':''} onchange="ses.tr=this.checked;document.querySelectorAll('.tr').forEach(e=>e.hidden=!ses.tr)"> ترجمهٔ همه</label>
<label><input type=checkbox ${s.loop?'checked':''} onchange="ses.loop=this.checked"> تکرار کل متن</label>
<label><input type=checkbox ${s.auto?'checked':''} onchange="ses.auto=this.checked;sesUI()"> خط بعدی خودکار</label>
${two&&s.step==4?`<br>نقش من: <select onchange="ses.role=this.value"><option value="">هیچ‌کدام</option><option ${s.role=='A'?'selected':''}>A</option><option ${s.role=='B'?'selected':''}>B</option></select> <small>خط‌های نقش تو پخش نمی‌شود؛ خودت بگو.</small>`:''}</div>
<p id=st class=note ${stm?'':'hidden'}>${esc(stm)}</p>${s.step==1?'<p class=note>متن مخفی است. فقط گوش بده و ببین چه‌قدر می‌فهمی.</p>':'<small class=mut>روی هر جمله بزن تا ترجمهٔ فارسی‌اش بیاید.</small>'+s.t.lines.map((l,i)=>`<div onclick="trT(${i})"><p class=ln id=l${i}>${l[0]?`<b>${l[0]}:</b> `:''}${l[1]}</p><div class=tr id=f${i} ${s.tr?'':'hidden'}>${esc(fa_(s.t,i)||'ترجمه برای این متن ذخیره نشده.')}</div></div>`).join('')}
${s.step==5?`<div class=card><p>جمله‌ها را بخوان و ضبط کن، بعد صدای خودت را با نسخهٔ اصلی مقایسه کن. به ریتم، تأکید کلمه‌ها و اتصال کلمه‌ها گوش بده.</p><button id=rs class=pri onclick="recT()">شروع ضبط</button><button onclick="play()">پخش اصلی</button><button id=pb hidden onclick="pron()">بازخورد تلفظ با Gemini</button><br><div id=pr></div><audio id=mine controls hidden style=width:100%></audio></div>`:''}
<button class="big pri" onclick="finish()">پایان جلسه و ثبت تمرین</button></div>`}
let rec,ch=[];
async function recT(){if(rec&&rec.state=='recording'){rec.stop();return}try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);ch=[];rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());const a=$('#mine');a.src=URL.createObjectURL(new Blob(ch,{type:rec.mimeType}));a.hidden=false;$('#pb').hidden=false;$('#rs').textContent='ضبط دوباره'};rec.start();$('#rs').textContent='توقف ضبط'}catch(e){alert('اجازهٔ میکروفون داده نشد یا میکروفون در دسترس نیست.')}}
async function toWav(blob){const ac=new (window.AudioContext||window.webkitAudioContext)(),buf=await ac.decodeAudioData(await blob.arrayBuffer()),n=Math.ceil(buf.duration*16000),oc=new OfflineAudioContext(1,n,16000),sr=oc.createBufferSource();sr.buffer=buf;sr.connect(oc.destination);sr.start();const d=(await oc.startRendering()).getChannelData(0),b=new DataView(new ArrayBuffer(44+n*2)),w=(o,t)=>[...t].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');b.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,16000,true);b.setUint32(28,32000,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n*2,true);for(let i=0;i<n;i++)b.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]))*32767,true);return new Blob([b.buffer],{type:'audio/wav'})}
async function pron(){const o=$('#pr');o.textContent='در حال گوش‌دادن…';try{const w=await toWav(new Blob(ch,{type:rec.mimeType})),a=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(w)}),f=(await api({a:'pron',audio:a,text:ses.t.lines.filter(l=>!ses.role||l[0]==ses.role).map(l=>l[1]).join(' ')})).fb;o.innerHTML=`<p>${esc(f.summary)}</p>`+f.words.map(x=>`<div class=fb><b class=en>${esc(x.w)}</b><div>${esc(x.tip)}</div></div>`).join('');f.words.forEach(x=>S.pw.push({w:x.w,d:day()}));S.pw=S.pw.slice(-40);markDay(0);push()}catch(e){o.innerHTML=`<span class=err>${esc(e.message)}</span>`}}
function closeS(){stopAll();$('#ses').hidden=true}
function finish(){stopAll();markDay(Math.max(1,Math.round((Date.now()-ses.t0)/6e4)));S.done[ses.t.id]=(S.done[ses.t.id]||0)+1;td().sh++;S.rec.push(ses.t.title);S.rec=S.rec.slice(-20);const d=day();ses.t.vocab.forEach(([e,f])=>{if(!S.vocab[e])S.vocab[e]={fa:f,box:0,due:d}});save();push();$('#ses').hidden=true;tab='home';render()}
theme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);speechSynthesis.onvoiceschanged=()=>{if(tab=='more')render()};render();pull().then(()=>{if(S.url&&S.cd!=day())coachGet()});
</script></body></html>
